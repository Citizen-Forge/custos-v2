services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: custos
      POSTGRES_PASSWORD: custos
      POSTGRES_DB: custos_harness
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custos"]
      interval: 2s
      timeout: 3s
      retries: 10

  harness:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Real gap found 2026-08-30: every OTHER .env.example variable
    # (SLACK_*, GEMINI_*, CLASSIFIER_*, LOCAL_FALLBACK_*, TURN_BUDGET,
    # every *_MAX_TOKENS override) was documented but never reached any
    # container, because only vars explicitly named below ever did --
    # env_file makes the whole of .env reach the container the way its
    # own docs already implied it would. `required: false` so a fresh
    # checkout with no .env yet (only .env.example) still starts.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://custos:custos@postgres:5432/custos_harness
      LOCAL_MODEL_BASE_URL: ${LOCAL_MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      LOCAL_MODEL_NAME: ${LOCAL_MODEL_NAME:-qwen2.5:7b-instruct}
      HARNESS_WORKSPACE: /workspace
      # SEAT_ID only binds the legacy single-seat worker (`python -m
      # harness.worker`), which this service no longer runs -- kept so
      # that entrypoint still works when invoked directly.
      SEAT_ID: ${SEAT_ID:-worker}
      # How many agents may work at once. Deliberately NOT the same limit
      # as a provider's concurrency_limit, which caps simultaneous LLM
      # requests and is already enforced by routing.ConcurrencyGate --
      # more agents than inference slots is a valid setup, the model
      # calls just queue on the gate.
      MAX_RUNNING_AGENTS: ${MAX_RUNNING_AGENTS:-1}
    # host.docker.internal resolves automatically on Docker Desktop
    # (Windows/Mac) but NOT on native Linux Docker (e.g. Unraid) unless
    # told to -- this makes the fallback above actually work there too,
    # rather than silently failing to reach an Ollama/llama.cpp server
    # running on the host itself. A harmless no-op wherever
    # LOCAL_MODEL_BASE_URL is already set to a real LAN IP instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Explicit (rather than the implicit default every service gets for
    # free) so a deployment overlay can union-merge in an additional
    # network -- e.g. docker-compose.prod.yml attaching this to a
    # macvlan network to reach an LLM server that also lives on one --
    # without replacing this one. Compose merges `networks:` across
    # files only when the base file already declares the list itself.
    networks:
      - default
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./workspace:/workspace
      # self_modifier.py's own writable checkout (Phase 7's self-
      # modification agent, added 2026-08-30) -- a Docker-managed named
      # volume, deliberately NOT a second bind mount of ./src: mounting
      # the same host directory twice (once :ro, once :rw) would point
      # both at the identical files, silently reopening the exact
      # read-write control-plane gap this project already found and
      # fixed once (see self_mod.py's module docstring). A named volume
      # has no host path to collide with -- it's a real, physically
      # separate copy, seeded by self_modifier.sync_checkout_from_live.
      - self_mod_checkout:/self-mod-checkout
    # Was `harness.worker`, which ran exactly one seat (SEAT_ID, default
    # "worker") and so never ran any seat the product-owner created --
    # the live bug that motivated the dispatcher. This drives the whole
    # roster instead: capacity check, product-owner brokers one ticket,
    # agent instantiated on demand.
    command: ["python", "-m", "harness.dispatcher"]

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # See harness's env_file comment above -- this is what makes
    # API_AUTH_TOKEN (and MODEL_REGISTRY/LOCAL_MODEL_* for the
    # /settings/model-registry endpoint's accuracy) actually reach this
    # service. Before this, API_AUTH_TOKEN had no effect no matter what
    # was in .env -- auth.py's code was correct, nothing carried the
    # value into the container that enforces it.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://custos:custos@postgres:5432/custos_harness
      HARNESS_WORKSPACE: /workspace
    # See harness's networks comment above -- same reasoning: explicit
    # so a deployment overlay (docker-compose.prod.yml) can union-merge
    # in a macvlan network without replacing this one, since api still
    # needs `default` to reach postgres.
    networks:
      - default
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./workspace:/workspace
    ports:
      - "8000:8000"
    command: ["uvicorn", "harness.api:app", "--host", "0.0.0.0", "--port", "8000"]

  # Periodically runs product-owner/meta-agent/overwatch/verifier instead
  # of manual `docker compose run` invocations for each. On by default
  # (a standard `docker compose up` service, same as harness/api) -- a
  # deliberate reversal of v1's "autonomy off by default" posture, per
  # the user's own call (2026-08-29): this harness is built around a
  # local, unmetered model, so the cost/risk calculus that justified
  # gating things behind manual activation in v1 (real API spend per
  # call) doesn't really apply here. Scoped narrowly, though -- this
  # flips whether recurring *work* happens automatically, not whether
  # generated *tool code* activates automatically: prompts.py's revision
  # approval and tool_proposals.py's approve/reject gate are untouched,
  # since those protect against a bad change silently taking effect
  # (a real safety boundary), not against unwanted spend. Disable with
  # `docker compose up postgres harness api` (omitting scheduler) if
  # that reversal turns out to be wrong for a given deployment.
  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # See harness's env_file comment above -- same reasoning, this
    # service runs the same product-owner/meta-agent/overwatch/verifier
    # jobs and needs the same SLACK_*/*_MAX_TOKENS/etc coverage.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://custos:custos@postgres:5432/custos_harness
      LOCAL_MODEL_BASE_URL: ${LOCAL_MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      LOCAL_MODEL_NAME: ${LOCAL_MODEL_NAME:-qwen2.5:7b-instruct}
      HARNESS_WORKSPACE: /workspace
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-1800}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # See harness's networks comment above -- same reasoning.
    networks:
      - default
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./workspace:/workspace
    command: ["python", "scripts/run_scheduler.py"]

  # PLAN.md Phase 7: the only service that ever mounts the Docker socket.
  # Deliberately separate from harness/api -- if a worker container that
  # runs arbitrary agent shell_exec calls also held this, an agent could
  # just `docker run` its way out regardless of every other control.
  # Invoked ad-hoc (docker compose run), like meta-agent/product-owner --
  # not a long-running service, and it has no workspace mount at all,
  # since it never touches agent ticket work.
  sandbox-runner:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://custos:custos@postgres:5432/custos_harness
      SANDBOX_SCRATCH_CONTAINER_PATH: /sandbox-scratch
      SANDBOX_SCRATCH_HOST_PATH: ${PWD}/sandbox-scratch
      # Host-visible path to the real repo root, for the same Docker-
      # out-of-Docker reason SANDBOX_SCRATCH_HOST_PATH already exists:
      # run_self_mod_deploy.py's own `docker compose up --build` call
      # is resolved by the HOST daemon against the HOST filesystem, not
      # this container's `/repo-src` view of it.
      REPO_HOST_PATH: ${PWD}
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./sandbox-scratch:/sandbox-scratch
      # Read-write mount of the WHOLE repo (Phase 7's self-modification
      # pipeline, added 2026-08-30). run_self_mod_sandbox.py only ever
      # COPIES this to an ephemeral scratch dir before applying a diff
      # -- ':ro' would have been enough for that alone. It's read-write
      # because run_self_mod_deploy.py is the one piece of code in this
      # entire project trusted to write to the real tree (git apply +
      # commit) once a proposal is approved -- deliberately still never
      # exposed as anything an agent tool can reach: this mount exists
      # only in sandbox-runner, which no agent-invokable tool anywhere
      # in this codebase can trigger (only `docker compose --profile
      # sandbox run`, issued directly on the host).
      - .:/repo-src
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - sandbox

volumes:
  pgdata:
  self_mod_checkout:
