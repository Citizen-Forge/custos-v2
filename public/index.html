<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Custos v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #9aa3b2;
    --accent: #5b8cff;
    --danger: #ff6b6b;
    --ok: #4cd97b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
  }
  header h1 { font-size: 1.1rem; margin: 0; }
  header .sub { color: var(--muted); font-size: 0.85rem; }
  main {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1rem;
    padding: 1.5rem;
  }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
  }
  section h2 {
    font-size: 0.95rem;
    margin: 0 0 0.75rem;
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  section h2 .count {
    background: var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 0.05rem 0.5rem;
    font-size: 0.8rem;
  }
  .item {
    border-bottom: 1px solid var(--border);
    padding: 0.6rem 0;
    font-size: 0.9rem;
  }
  .item:last-child { border-bottom: none; }
  .item .id { color: var(--accent); font-family: monospace; font-size: 0.8rem; }
  .seat-head { display: flex; align-items: center; gap: 0.6rem; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--border); flex-shrink: 0;
  }
  .item .title { font-weight: 500; }
  .item .desc { color: var(--muted); font-size: 0.82rem; margin-top: 0.15rem; }
  .item .notes { color: var(--danger); font-size: 0.82rem; margin-top: 0.15rem; }
  .empty { color: var(--muted); font-size: 0.85rem; font-style: italic; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 4px;
    padding: 0.3rem 0.7rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  button:hover { opacity: 0.85; }
  .prompt-actions { margin-top: 0.4rem; display: flex; gap: 0.5rem; align-items: center; }
  .reason { color: var(--muted); font-size: 0.82rem; }
  form.outcomes { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
  input[type=text] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 0.35rem 0.5rem;
    font-size: 0.85rem;
    flex: 1;
  }
  .stat-row { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.85rem; }
  .stat { color: var(--muted); }
  .stat b { color: var(--text); font-size: 1.1rem; display: block; }
  #status { font-size: 0.75rem; color: var(--muted); }
  .board-section { grid-column: 1 / -1; }
  .project { border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; margin-bottom: 0.75rem; }
  .project:last-child { margin-bottom: 0; }
  .project-head { display: flex; align-items: baseline; gap: 0.5rem; }
  .project-head .title { font-weight: 600; font-size: 0.95rem; }
  .priority-badge {
    font-size: 0.7rem; padding: 0.05rem 0.4rem; border-radius: 999px;
    background: var(--border); color: var(--muted);
  }
  .priority-badge.p0, .priority-badge.p1 { background: var(--accent); color: white; }
  .story-seat { font-size: 0.75rem; opacity: 0.8; }

  .kanban-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-top: 0.75rem; }
  .kanban-col { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; min-height: 3rem; }
  .kanban-col-head {
    display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.5rem;
  }
  .kanban-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 5px;
    padding: 0.5rem; font-size: 0.8rem; margin-bottom: 0.5rem;
  }
  .kanban-card:last-child { margin-bottom: 0; }
  .kanban-card-epic { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .kanban-card-title { margin-top: 0.15rem; }

  .swimlane { margin-bottom: 1rem; }
  .swimlane:last-child { margin-bottom: 0; }
  .swimlane-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
  .swimlane-track { display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 0.25rem; }
  .roadmap-card {
    flex: 0 0 220px; border: 1px solid var(--border); border-radius: 6px;
    padding: 0.6rem; font-size: 0.85rem;
  }
  .roadmap-card-title { font-weight: 500; }
  .progress-bar { background: var(--border); border-radius: 999px; height: 6px; margin: 0.5rem 0 0.35rem; overflow: hidden; }
  .progress-fill { background: var(--accent); height: 100%; }
</style>
</head>
<body>
<header>
  <h1>Custos v2</h1>
  <span class="sub">harness dashboard</span>
  <span id="status" style="margin-left:auto"></span>
</header>
<main>
  <section class="board-section">
    <h2>Roadmap <span class="count" id="roadmap-count">0</span></h2>
    <div id="roadmap-list"></div>
  </section>
  <section class="board-section">
    <h2>Board <span class="count" id="projects-count">0</span></h2>
    <div id="projects-list"></div>
  </section>
  <section>
    <h2>Seats <span class="count" id="seats-count">0</span></h2>
    <div id="seats-list"></div>
  </section>
  <section>
    <h2>Ready <span class="count" id="ready-count">0</span></h2>
    <div id="ready-list"></div>
  </section>
  <section>
    <h2>In Progress <span class="count" id="in-progress-count">0</span></h2>
    <div id="in-progress-list"></div>
  </section>
  <section>
    <h2>Needs a Human <span class="count" id="human-count">0</span></h2>
    <div id="human-list"></div>
  </section>
  <section>
    <h2>Settings</h2>
    <div style="margin-bottom:1rem">
      <label style="display:block;font-size:0.85rem;color:var(--muted);margin-bottom:0.3rem">
        Cost slider: <span id="cost-slider-value">0</span>/100 (slow/free ↔ fast/costly)
      </label>
      <input type="range" id="cost-slider" min="0" max="100" value="0" style="width:100%">
      <div class="desc">Steers which configured provider tier the product-owner should reach for (check_model_options tool). Scaffolding today -- see PLAN.md.</div>
    </div>
    <div style="margin-bottom:1rem">
      <label style="display:block;font-size:0.85rem;color:var(--muted);margin-bottom:0.3rem">Avatar style (DiceBear)</label>
      <div style="display:flex;gap:0.5rem">
        <input type="text" id="avatar-style-input" placeholder="e.g. micah, bottts, personas">
        <button onclick="saveAvatarStyle()">Save</button>
      </div>
    </div>
    <div>
      <div style="font-size:0.85rem;color:var(--muted);margin-bottom:0.3rem">Model registry</div>
      <div id="model-registry-list"></div>
    </div>
  </section>
  <section>
    <h2>Wiki <span class="count" id="wiki-count">0</span></h2>
    <div id="wiki-list"></div>
    <div id="wiki-viewer" style="display:none;margin-top:0.75rem;border-top:1px solid var(--border);padding-top:0.75rem">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span class="id" id="wiki-viewer-slug"></span>
        <button onclick="closeWikiPage()">Close</button>
      </div>
      <pre id="wiki-viewer-content" style="white-space:pre-wrap;font-family:inherit;font-size:0.85rem;margin-top:0.5rem"></pre>
    </div>
  </section>
  <section>
    <h2>Outcomes</h2>
    <form class="outcomes" id="outcomes-form">
      <input type="text" id="outcomes-actor" placeholder="actor / role, e.g. worker">
      <button type="submit">Look up</button>
    </form>
    <div id="outcomes-result"></div>
  </section>
</main>
<script>
const REFRESH_MS = 5000;

// Carries API_AUTH_TOKEN (see auth.py) on every API call once one's
// been entered -- no-op against a deployment that never set the env
// var, since the backend accepts unauthenticated requests in that case.
const TOKEN_STORAGE_KEY = "custos_api_token";
let authToken = localStorage.getItem(TOKEN_STORAGE_KEY) || "";

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function ticketItem(t) {
  const notes = t.notes ? `<div class="notes">${escapeHtml(t.notes)}</div>` : "";
  return `<div class="item">
    <span class="id">${t.id}</span> <span class="title">${escapeHtml(t.title)}</span>
    <div class="desc">${escapeHtml(t.description || "")}</div>
    ${notes}
  </div>`;
}

// User's pick (2026-08-29), adjustable live via GET/PUT
// /settings/avatar-style -- fetched once at startup, not on every
// refresh cycle, since it rarely changes; refreshAll() re-renders
// seats using whatever's currently cached here.
let avatarStyle = "micah";

async function loadAvatarStyle() {
  try {
    const data = await fetchJSON("/settings/avatar-style");
    avatarStyle = data.value;
    document.getElementById("avatar-style-input").value = avatarStyle;
  } catch (e) {
    // keep the client-side default -- a missing/unreachable setting
    // shouldn't break avatar rendering, just fall back quietly.
  }
}

async function saveAvatarStyle() {
  const value = document.getElementById("avatar-style-input").value.trim();
  if (!value) return;
  try {
    await fetchJSON("/settings/avatar-style", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value }),
    });
    avatarStyle = value;
    refreshSeats(); // re-render with the new style immediately
  } catch (e) {
    window.alert(`failed to save: ${e.message}`);
  }
}

async function loadCostSlider() {
  try {
    const data = await fetchJSON("/settings/cost-slider");
    document.getElementById("cost-slider").value = data.value;
    document.getElementById("cost-slider-value").textContent = data.value;
  } catch (e) {
    // keep the default -- same reasoning as loadAvatarStyle
  }
}

document.getElementById("cost-slider").addEventListener("change", async (e) => {
  const value = parseInt(e.target.value, 10);
  document.getElementById("cost-slider-value").textContent = value;
  try {
    await fetchJSON("/settings/cost-slider", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value }),
    });
  } catch (err) {
    window.alert(`failed to save: ${err.message}`);
  }
});

async function refreshModelRegistry() {
  try {
    const items = await fetchJSON("/settings/model-registry");
    const container = document.getElementById("model-registry-list");
    container.innerHTML = items.length
      ? items.map(p => `<div class="item">
          <span class="id">${escapeHtml(p.name)}</span> — ${escapeHtml(p.model)}
          <span class="story-seat">cost tier ${p.cost_tier}</span>
        </div>`).join("")
      : `<div class="empty">no providers configured</div>`;
  } catch (e) {
    document.getElementById("model-registry-list").innerHTML = `<div class="empty">error: ${e.message}</div>`;
  }
}

function avatarUrl(seed) {
  // DiceBear's public, documented HTTP API -- deterministic per seed
  // (a given seat_id always renders the same face), no backend compute,
  // no GPU. Deliberately NOT a scraped "this-person-does-not-exist"
  // style site (no documented API, automated access risks
  // rate-limiting/blocking) and NOT a locally-run GAN (StyleGAN3 is
  // GPU-optimized; CPU inference would be slow and would compete with
  // the Qwen inference server for the same constrained hardware this
  // whole project has been tuned around). Illustrated portrait style,
  // not photorealistic -- a real tradeoff, see PLAN.md.
  return `https://api.dicebear.com/9.x/${encodeURIComponent(avatarStyle)}/svg?seed=${encodeURIComponent(seed)}`;
}

function formatDuration(totalSeconds) {
  const s = Math.round(totalSeconds);
  if (s < 60) return `${s}s`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m}m`;
  const h = (m / 60).toFixed(1);
  return `${h}h`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

async function fetchJSON(url, opts) {
  const headers = { ...(opts && opts.headers) };
  if (authToken) headers["Authorization"] = `Bearer ${authToken}`;
  const res = await fetch(url, { ...opts, headers });

  if (res.status === 401) {
    // The deployment has API_AUTH_TOKEN set and we don't have a valid
    // one yet -- ask once, save it, and let the caller's own retry
    // logic (refreshAll's next cycle) pick it up rather than looping
    // prompts here.
    const entered = window.prompt("API token required (Authorization: Bearer <token>):");
    if (entered) {
      authToken = entered.trim();
      localStorage.setItem(TOKEN_STORAGE_KEY, authToken);
    }
    throw new Error(`${url} -> 401`);
  }

  if (!res.ok) throw new Error(`${url} -> ${res.status}`);
  return res.json();
}

function humanTicketItem(t) {
  const notes = t.notes ? `<div class="notes">${escapeHtml(t.notes)}</div>` : "";
  return `<div class="item">
    <span class="id">${t.id}</span> <span class="title">${escapeHtml(t.title)}</span>
    <div class="desc">${escapeHtml(t.description || "")}</div>
    ${notes}
    <div class="prompt-actions">
      <button onclick="respondToTicket('${t.id}')">Respond</button>
      <button onclick="dismissTicket('${t.id}')">Dismiss</button>
    </div>
  </div>`;
}

async function respondToTicket(id) {
  const response = window.prompt("Response to send back (closes the ticket):");
  if (!response) return;
  await fetchJSON(`/tickets/${id}/respond`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ response }),
  });
  refreshAll();
}

async function dismissTicket(id) {
  const reason = window.prompt("Reason for dismissing (optional, closes the ticket):") || null;
  await fetchJSON(`/tickets/${id}/dismiss`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ reason }),
  });
  refreshAll();
}

async function refreshTickets(status, listId, countId, renderFn = ticketItem) {
  try {
    const items = await fetchJSON(`/tickets?status=${status}`);
    document.getElementById(countId).textContent = items.length;
    const container = document.getElementById(listId);
    container.innerHTML = items.length
      ? items.map(renderFn).join("")
      : `<div class="empty">nothing here</div>`;
  } catch (e) {
    document.getElementById(listId).innerHTML = `<div class="empty">error: ${e.message}</div>`;
  }
}

async function refreshSeats() {
  try {
    const items = await fetchJSON("/seats");
    document.getElementById("seats-count").textContent = items.length;
    const container = document.getElementById("seats-list");
    container.innerHTML = items.length
      ? items.map(s => `<div class="item">
          <div class="seat-head">
            <img class="avatar" src="/avatars/${encodeURIComponent(s.seat_id)}" alt=""
                 loading="lazy" onerror="this.onerror=null;this.src=avatarUrl(s.seat_id)">
            <span class="id">${s.display_name ? `${escapeHtml(s.display_name)} <span style="opacity:0.6;font-weight:normal">(${escapeHtml(s.seat_id)}${s.pronouns ? `, ${escapeHtml(s.pronouns)}` : ""})</span>` : escapeHtml(s.seat_id)}</span>
          </div>
          <div class="desc">${escapeHtml(s.specialty)}</div>
          <button onclick="viewWikiPage('agents/${encodeURIComponent(s.seat_id)}')" style="margin-top:0.3rem">Profile</button>
          <div class="stat-row" style="margin-top:0.3rem">
            <div class="stat"><b>${s.outcomes.closed}</b>closed</div>
            <div class="stat"><b>${s.outcomes.refused}</b>refused</div>
            <div class="stat"><b>${s.outcomes.still_open}</b>open</div>
          </div>
          ${s.verification.verified_total > 0 ? `<div class="stat-row">
            <div class="stat"><b>${s.verification.passed}</b>verified pass</div>
            <div class="stat"><b>${s.verification.failed}</b>verified fail</div>
          </div>` : ""}
          ${(s.queue.ready + s.queue.in_progress) > 0 ? `<div class="desc" style="margin-top:0.3rem">
            queue: ${s.queue.ready} ready, ${s.queue.in_progress} in progress
            ${s.queue.estimated_wait_seconds != null
              ? ` — ~${formatDuration(s.queue.estimated_wait_seconds)} at this seat's own pace (${s.queue.sample_size} past ticket${s.queue.sample_size === 1 ? "" : "s"})`
              : ` — no completion history yet to estimate from`}
          </div>` : ""}
        </div>`).join("")
      : `<div class="empty">no seats yet -- the product-owner creates these as work demands</div>`;
  } catch (e) {
    document.getElementById("seats-list").innerHTML = `<div class="empty">error: ${e.message}</div>`;
  }
}

const KANBAN_COLUMNS = [
  { key: "open", label: "Open" },
  { key: "in_progress", label: "In Progress" },
  { key: "closed", label: "Done" },
];

function kanbanCard(story) {
  const seat = (story.metadata && story.metadata.assigned_seat) || null;
  return `<div class="kanban-card">
    <div class="kanban-card-epic">${escapeHtml(story.epicTitle || "")}</div>
    <div class="kanban-card-title"><span class="id">${story.id}</span> ${escapeHtml(story.title)}</div>
    ${seat ? `<div class="story-seat">→ ${escapeHtml(seat)}</div>` : ""}
  </div>`;
}

function projectCard(project) {
  const stories = (project.epics || []).flatMap(epic =>
    (epic.stories || []).map(s => ({ ...s, epicTitle: epic.title }))
  );
  const byStatus = { open: [], in_progress: [], closed: [] };
  for (const s of stories) (byStatus[s.status] || byStatus.open).push(s);

  const columns = KANBAN_COLUMNS.map(({ key, label }) => `
    <div class="kanban-col">
      <div class="kanban-col-head">${label} <span>${byStatus[key].length}</span></div>
      ${byStatus[key].map(kanbanCard).join("") || `<div class="empty">—</div>`}
    </div>
  `).join("");

  return `<div class="project">
    <div class="project-head">
      <span class="priority-badge p${project.priority}">P${project.priority}</span>
      <span class="title">${project.id} — ${escapeHtml(project.title)}</span>
    </div>
    <div class="desc">${escapeHtml(project.description || "")}</div>
    ${stories.length ? `<div class="kanban-board">${columns}</div>` : `<div class="empty" style="margin-top:0.5rem">no epics/stories yet</div>`}
  </div>`;
}

function roadmapEpicCard(epic) {
  const stories = epic.stories || [];
  const closed = stories.filter(s => s.status === "closed").length;
  const pct = stories.length ? Math.round((100 * closed) / stories.length) : 0;
  return `<div class="roadmap-card">
    <div class="roadmap-card-title">${escapeHtml(epic.title)}</div>
    <div class="desc">${escapeHtml(epic.projectTitle)}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="story-seat">${closed}/${stories.length} stories done</div>
  </div>`;
}

function renderRoadmap(projects) {
  const lanes = {};
  for (const project of projects) {
    for (const epic of project.epics || []) {
      const priority = epic.priority ?? project.priority ?? 9;
      (lanes[priority] = lanes[priority] || []).push({ ...epic, projectTitle: project.title });
    }
  }
  const priorities = Object.keys(lanes).map(Number).sort((a, b) => a - b);
  document.getElementById("roadmap-count").textContent = priorities.reduce((n, p) => n + lanes[p].length, 0);
  document.getElementById("roadmap-list").innerHTML = priorities.length
    ? priorities.map(p => `<div class="swimlane">
        <div class="swimlane-head"><span class="priority-badge p${p}">P${p}</span></div>
        <div class="swimlane-track">${lanes[p].map(roadmapEpicCard).join("")}</div>
      </div>`).join("")
    : `<div class="empty">no epics yet -- the product-owner creates these from ideas</div>`;
}

async function refreshProjects() {
  try {
    const items = await fetchJSON("/projects");
    document.getElementById("projects-count").textContent = items.length;
    document.getElementById("projects-list").innerHTML = items.length
      ? items.map(projectCard).join("")
      : `<div class="empty">no projects yet -- the product-owner creates these from ideas</div>`;
    renderRoadmap(items);
  } catch (e) {
    const msg = `<div class="empty">error: ${e.message}</div>`;
    document.getElementById("projects-list").innerHTML = msg;
    document.getElementById("roadmap-list").innerHTML = msg;
  }
}

async function refreshWiki() {
  try {
    const data = await fetchJSON("/wiki");
    document.getElementById("wiki-count").textContent = data.pages.length;
    const container = document.getElementById("wiki-list");
    container.innerHTML = data.pages.length
      ? data.pages.map(slug => `<div class="item">
          <span class="id">${escapeHtml(slug)}</span>
          <button onclick="viewWikiPage('${escapeHtml(slug)}')" style="float:right">View</button>
        </div>`).join("")
      : `<div class="empty">no pages yet</div>`;
  } catch (e) {
    document.getElementById("wiki-list").innerHTML = `<div class="empty">error: ${e.message}</div>`;
  }
}

async function viewWikiPage(slug) {
  const viewer = document.getElementById("wiki-viewer");
  const content = document.getElementById("wiki-viewer-content");
  document.getElementById("wiki-viewer-slug").textContent = slug;
  viewer.style.display = "block";
  content.textContent = "loading…";
  try {
    const page = await fetchJSON(`/wiki/${slug.split("/").map(encodeURIComponent).join("/")}`);
    content.textContent = page.content;
  } catch (e) {
    content.textContent = `no page at '${slug}' yet`;
  }
  viewer.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function closeWikiPage() {
  document.getElementById("wiki-viewer").style.display = "none";
}

async function refreshAll() {
  await Promise.all([
    refreshProjects(),
    refreshSeats(),
    refreshTickets("ready", "ready-list", "ready-count"),
    refreshTickets("in_progress", "in-progress-list", "in-progress-count"),
    refreshTickets("human", "human-list", "human-count", humanTicketItem),
    refreshWiki(),
  ]);
  document.getElementById("status").textContent = "updated " + new Date().toLocaleTimeString();
}

document.getElementById("outcomes-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const actor = document.getElementById("outcomes-actor").value.trim();
  if (!actor) return;
  const result = document.getElementById("outcomes-result");
  try {
    const data = await fetchJSON(`/outcomes/${encodeURIComponent(actor)}`);
    result.innerHTML = `<div class="stat-row">
      <div class="stat"><b>${data.total}</b>total</div>
      <div class="stat"><b>${data.closed}</b>closed</div>
      <div class="stat"><b>${data.refused}</b>refused</div>
      <div class="stat"><b>${data.still_open}</b>still open</div>
    </div>`;
  } catch (e) {
    result.innerHTML = `<div class="empty">error: ${e.message}</div>`;
  }
});

async function init() {
  // Settings rarely change -- load once before the first render (so
  // avatars use the real style from the start, not a flash of the
  // default) rather than polling them every refresh cycle like tickets.
  await Promise.all([loadAvatarStyle(), loadCostSlider(), refreshModelRegistry()]);
  await refreshAll();
  setInterval(refreshAll, REFRESH_MS);
}

init();
</script>
